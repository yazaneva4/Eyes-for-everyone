<!doctype html>
<html lang="en" dir="ltr" data-theme="yellow">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0a09" />
    <meta name="description" content="Take a photo, ask a question out loud, hear the answer. A helper for people with low vision." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Eyes for Everyone</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@500;700;800&family=Noto+Sans+Arabic:wght@500;800&family=Noto+Sans+Malayalam:wght@500;800&display=swap"
    />
    <link rel="stylesheet" href="/css/app.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body data-state="start" data-camera="off" data-photo="off" data-sheet="auto">
    <svg class="sprite" width="0" height="0" aria-hidden="true">

          <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="2" seed="11" result="noise" />
          <feGaussianBlur in="noise" stdDeviation="3" result="soft" />
          <feDisplacementMap in="SourceGraphic" in2="soft" scale="46" xChannelSelector="R" yChannelSelector="G" />
        </filter>

        <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3Z" /></symbol>
        <symbol id="i-speed" viewBox="0 0 24 24"><path d="M4.2 17a8.5 8.5 0 1 1 15.6 0" /><path d="m12 13 4-4.5" /><circle cx="12" cy="13" r="1.2" /></symbol>
        <symbol id="i-contrast" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor" /></symbol>
        <symbol id="i-reader" viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="1.8" /><path d="M5 8.5 12 10l7-1.5M12 10v4.5M12 14.5 9 21M12 14.5 15 21" /></symbol>
        <symbol id="i-text" viewBox="0 0 24 24"><path d="M3 19 8 5l5 14M4.8 14h6.4M15 19l3-8 3 8M15.9 16.6h4.2" /></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" /></symbol>
        <symbol id="i-kaaba" viewBox="0 0 24 24"><path d="M12 3 21 7.5v9L12 21l-9-4.5v-9Z" /><path d="M3 7.5 12 12l9-4.5M12 12v9M3.4 10.6 12 15l8.6-4.4" /></symbol>
        <symbol id="i-help" viewBox="0 0 256 256"><g fill="currentColor" stroke="none"><path d="M144,180a16,16,0,1,1-16-16A16,16,0,0,1,144,180Zm92-52A108,108,0,1,1,128,20,108.12,108.12,0,0,1,236,128Zm-24,0a84,84,0,1,0-84,84A84.09,84.09,0,0,0,212,128ZM128,64c-24.26,0-44,17.94-44,40v4a12,12,0,0,0,24,0v-4c0-8.82,9-16,20-16s20,7.18,20,16-9,16-20,16a12,12,0,0,0-12,12v8a12,12,0,0,0,23.73,2.56C158.31,137.88,172,122.37,172,104,172,81.94,152.26,64,128,64Z"/></g></symbol>
        <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor" /></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" /></symbol>
        <symbol id="i-image" viewBox="0 0 256 256"><g fill="currentColor" stroke="none"><path d="M144,96a16,16,0,1,1,16,16A16,16,0,0,1,144,96Zm92-40V200a20,20,0,0,1-20,20H40a20,20,0,0,1-20-20V56A20,20,0,0,1,40,36H216A20,20,0,0,1,236,56ZM44,60v79.72l33.86-33.86a20,20,0,0,1,28.28,0L147.31,147l17.18-17.17a20,20,0,0,1,28.28,0L212,149.09V60Zm0,136H162.34L92,125.66l-48,48Zm168,0V183l-33.37-33.37L164.28,164l32,32Z"/></g></symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 3 19 20l-7-4-7 4Z" /></symbol>
      </defs>
    </svg>

    <!-- Background: live camera, the frozen photo, or soft moving light -->
    <div id="scene" aria-hidden="true">
      <div class="aurora"><span></span><span></span><span></span></div>
      <video id="video" playsinline muted autoplay></video>
      <img id="photo" alt="" />
      <div class="veil"></div>
    </div>
    <div id="flash" aria-hidden="true"></div>
    <!-- Glowing screen edge while listening and thinking -->
    <div class="edge edge-soft" aria-hidden="true"></div>
    <div class="edge edge-sharp" aria-hidden="true"></div>

    <!-- Top bar: help · status · settings -->
    <header class="topbar">
      <button id="btn-help" class="icon-btn glass" type="button" aria-label="Help"><svg class="ic" aria-hidden="true"><use href="#i-help" /></svg></button>
      <div class="pill glass" aria-hidden="true"><span class="orb"></span><span id="status-word">START</span></div>
      <button id="btn-settings" class="icon-btn glass" type="button" aria-label="Settings"><svg class="ic" aria-hidden="true"><use href="#i-gear" /></svg></button>
    </header>

    <div class="hud">
      <!-- Middle of the screen: a picture of what is happening now -->
      <div class="focus" aria-hidden="true">
        <div class="brand">
          <div class="logo glass"><svg class="ic"><use href="#i-eye" /></svg></div>
          <div class="wordmark" id="wordmark">Eyes for Everyone</div>
        </div>
        <div class="viewfinder"><i></i><i></i><i></i><i></i></div>
        <div class="compass">
          <span class="pointer"></span>
          <div class="rose">
            <span class="ticks"></span>
            <b class="cardinal n">N</b><b class="cardinal e">E</b><b class="cardinal s">S</b><b class="cardinal w">W</b>
            <span class="qibla-mark"><svg class="ic"><use href="#i-kaaba" /></svg></span>
          </div>
          <!-- Live pointer: always points at the Kaaba, from wherever the phone is facing -->
          <span class="needle"><svg class="ic"><use href="#i-arrow" /></svg></span>
        </div>
        <!-- A glowing orange orb: it spins, and grows and shrinks with how loud you or the AI speak -->
        <div class="orb3d"><span class="swirl"></span><span class="grain"></span><span class="flow"></span><span class="sheen"></span><span class="glint"></span></div>
      </div>

      <div class="sheet glass">
        <button id="grabber" class="grabber" type="button" aria-label="Expand answer"><span aria-hidden="true"></span></button>
        <div id="message"></div>
      </div>
    </div>

    <!-- The whole screen is one big button: tap anywhere to take a photo -->
    <button id="stage" type="button" aria-label="Tap anywhere to start"></button>

    <!-- Bottom bar: gallery · Describe | Qibla · one button that changes with the moment (repeat / ask) -->
    <!-- Upload photo: always in the bottom corner (kept out of the bar so it never moves) -->
    <button id="btn-gallery" class="icon-btn glass" type="button" aria-label="Upload photo"><svg class="ic" aria-hidden="true"><use href="#i-image" /></svg><span class="btn-text" id="gallery-text">Upload photo</span></button>
    <nav class="dock" aria-label="Controls">
      <div class="modebar glass" id="modebar" role="tablist">
        <button type="button" role="tab" data-mode="describe">Describe</button>
        <button type="button" role="tab" data-mode="qibla">Qibla</button>
      </div>
      <button id="btn-side" class="icon-btn glass" type="button" aria-label="Repeat answer"><svg class="ic" aria-hidden="true"><use id="side-icon" href="#i-redo" /></svg></button>
    </nav>


    <div id="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
      <div class="settings-sheet glass">
        <header class="sheet-head">
          <h2 id="settings-title">Settings</h2>
          <button id="settings-done" class="done-btn" type="button">Done</button>
        </header>
        <div class="group">
          <div class="set-row">
            <svg class="ic" aria-hidden="true"><use href="#i-globe" /></svg>
            <span class="lbl" id="lbl-lang">Language</span>
            <div class="seg" role="radiogroup" aria-labelledby="lbl-lang" data-set="lang">
              <button type="button" role="radio" data-v="en" lang="en">EN</button>
              <button type="button" role="radio" data-v="ar" lang="ar">عربي</button>
              <button type="button" role="radio" data-v="ml" lang="ml">മല</button>
            </div>
          </div>
          <div class="set-row">
            <svg class="ic" aria-hidden="true"><use href="#i-text" /></svg>
            <label class="lbl" id="lbl-size" for="set-size">Text size</label>
            <input id="set-size" type="range" min="0" max="8" step="1" />
            <output id="out-size" for="set-size">24</output>
          </div>
          <div class="set-row">
            <svg class="ic" aria-hidden="true"><use href="#i-speed" /></svg>
            <label class="lbl" id="lbl-speed" for="set-speed">Speech speed</label>
            <input id="set-speed" type="range" min="0" max="6" step="1" />
            <output id="out-speed" for="set-speed">1×</output>
          </div>
          <div class="set-row">
            <svg class="ic" aria-hidden="true"><use href="#i-contrast" /></svg>
            <span class="lbl" id="lbl-theme">Colours</span>
            <div class="swatches" role="radiogroup" aria-labelledby="lbl-theme">
              <button type="button" role="radio" class="sw sw-yellow" data-v="yellow"></button>
              <button type="button" role="radio" class="sw sw-white" data-v="white"></button>
              <button type="button" role="radio" class="sw sw-light" data-v="light"></button>
            </div>
          </div>
          <div class="set-row">
            <svg class="ic" aria-hidden="true"><use href="#i-reader" /></svg>
            <span class="lbl" id="lbl-sr">Screen reader mode</span>
            <button id="set-sr" class="switch" type="button" role="switch" aria-checked="false" aria-labelledby="lbl-sr"><span></span></button>
          </div>
        </div>
      </div>
    </div>

    <!-- Pictures from the gallery or the computer (gallery button, swipe down, or the O key) -->
    <input id="file-input" type="file" accept="image/*" hidden />

    <!-- Laptop/PC: shown while a picture is dragged over the window -->
    <div id="drop" aria-hidden="true"><div class="glass"><svg class="ic"><use href="#i-image" /></svg><span id="drop-text">Drop the picture here.</span></div></div>

    <!-- Screen readers announce these when they change -->
    <div id="live-status" class="sr-only" role="status" aria-live="assertive" aria-atomic="true"></div>
    <div id="live-message" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <noscript><p class="noscript">Eyes for Everyone needs JavaScript turned on.</p></noscript>
  </body>
</html>
