<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#090603" />
<title>Pulse Orb — Multipurpose AI Companion</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #090603;
    --ink: #fff7ec;
    --muted: #ad9a88;
    --hot: #ff7a12;
    --gold: #ffc15a;
    --orb-size: min(74vw, 400px);
    --rate: 1;
    --accent: #ff9a26;
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; min-height: 100%; margin: 0; }
  body {
    min-height: 100svh;
    overflow: hidden;
    display: grid;
    place-items: center;
    color: var(--ink);
    background:
      radial-gradient(ellipse at 50% 44%, rgba(255, 97, 5, .12), transparent 30%),
      radial-gradient(ellipse at 50% 54%, rgba(255, 152, 27, .055), transparent 47%),
      #090603;
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .scene {
    width: 100%; min-height: 100svh; padding: 28px 18px 32px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    isolation: isolate; position: relative;
  }
  .scene::before {
    content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background-image: radial-gradient(rgba(255, 188, 120, .12) .6px, transparent .6px);
    background-size: 24px 24px; opacity: .14;
    mask-image: radial-gradient(ellipse at center, #000, transparent 75%);
  }
  .eyebrow {
    margin: 0 0 30px; color: #d8a97a; font-size: 11px; font-weight: 700;
    letter-spacing: .25em; text-transform: uppercase; opacity: .92;
  }
  .brand { margin: 0 0 8px; color: #fff3e4; font-size: clamp(24px, 4vw, 34px); font-weight: 650; letter-spacing: -.045em; }
  .subtitle { max-width: 420px; margin: 0 0 26px; color: #b9a18a; font-size: 13px; line-height: 1.6; text-align: center; }
  .orb-stage {
    width: var(--orb-size); aspect-ratio: 1; position: relative; display: grid; place-items: center;
    transform: translateZ(0); isolation: isolate;
    filter: drop-shadow(0 0 24px rgba(255, 104, 10, .12));
  }
  .aura, .aura::before, .aura::after {
    content: ""; position: absolute; inset: -16%; border-radius: 50%; pointer-events: none;
  }
  .aura {
    background: conic-gradient(from 0deg, transparent 0 7%, rgba(255, 85, 0, .45) 15%, transparent 27%, rgba(255, 185, 55, .38) 41%, transparent 57%, rgba(255, 64, 0, .34) 70%, transparent 84%, rgba(255, 166, 30, .34) 94%, transparent);
    filter: blur(30px); opacity: .78; animation: aura-spin calc(13s / var(--rate)) linear infinite;
  }
  .aura::before {
    inset: 11%; background: conic-gradient(from 180deg, rgba(255, 176, 44, .27), transparent 24%, rgba(255, 70, 0, .42) 48%, transparent 70%, rgba(255, 207, 93, .30));
    filter: blur(23px); animation: aura-spin calc(8s / var(--rate)) linear infinite reverse;
  }
  .orb-shell {
    position: relative; width: 100%; height: 100%; border-radius: 50%; overflow: visible;
    isolation: isolate; transform: translateZ(0);
    box-shadow: 0 0 55px rgba(255, 96, 0, .15), 0 0 110px rgba(255, 83, 0, .08);
    animation: breathe calc(4.6s / var(--rate)) ease-in-out infinite;
  }
  .orb-shell::before {
    content: ""; position: absolute; z-index: 2; inset: 0; border-radius: inherit; pointer-events: none;
    background:
      radial-gradient(ellipse at 30% 17%, rgba(255,255,255,.77) 0%, rgba(255,236,199,.34) 5%, transparent 18%),
      radial-gradient(ellipse at 72% 77%, transparent 38%, rgba(39,8,0,.24) 74%, rgba(15,4,0,.8) 100%);
    box-shadow: inset -17px -20px 36px rgba(24, 5, 0, .5), inset 8px 8px 18px rgba(255, 255, 255, .13), inset 0 0 18px rgba(255, 181, 87, .17);
  }
  #orbCanvas {
    position: absolute; inset: 0; display: block; width: 100%; height: 100%; border-radius: 50%;
  }
  .energy-ring {
    position: absolute; pointer-events: none; border-radius: 50%;
    border: 1px solid rgba(255, 173, 74, .32);
    box-shadow: 0 0 10px rgba(255, 114, 12, .08), inset 0 0 7px rgba(255, 187, 70, .05);
    transform-style: preserve-3d;
  }
  .ring-one { inset: -8%; transform: rotate(-28deg) scaleY(.33); animation: ring-drift calc(9s / var(--rate)) ease-in-out infinite; }
  .ring-two { inset: -3%; border-color: rgba(255, 104, 28, .27); transform: rotate(52deg) scaleY(.43); animation: ring-drift-two calc(11s / var(--rate)) ease-in-out infinite; }
  .ring-three { inset: -13%; border-color: rgba(255, 204, 109, .14); transform: rotate(77deg) scaleY(.27); animation: ring-drift calc(17s / var(--rate)) ease-in-out infinite reverse; }
  .spark {
    position: absolute; width: 5px; height: 5px; border-radius: 50%; pointer-events: none;
    background: #fff0be; box-shadow: 0 0 9px 3px rgba(255, 162, 49, .75), 0 0 22px 6px rgba(255, 77, 0, .25);
    top: 14%; right: 12%; animation: sparkle calc(2.7s / var(--rate)) ease-in-out infinite;
  }
  .spark.two { width: 3px; height: 3px; top: 72%; right: 1%; animation-delay: -1.1s; animation-duration: calc(3.2s / var(--rate)); }
  .spark.three { width: 4px; height: 4px; top: 82%; left: 11%; animation-delay: -.6s; }
  .status { margin-top: 45px; display: flex; align-items: center; gap: 10px; color: #fff4e7; font-size: 15px; letter-spacing: .015em; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #ffae38; box-shadow: 0 0 10px rgba(255, 137, 17, .95); animation: dot-pulse calc(1.55s / var(--rate)) ease-in-out infinite; }
  .hint { margin: 10px 0 0; color: var(--muted); font-size: 12px; text-align: center; }
  .controls { display: flex; gap: 10px; margin-top: 26px; flex-wrap: wrap; justify-content: center; }
  button {
    appearance: none; border: 1px solid rgba(255, 172, 94, .23); border-radius: 999px;
    background: rgba(255, 136, 31, .06); color: #ffe3c7; padding: 10px 15px; font: inherit;
    font-size: 12px; cursor: pointer; transition: background .2s, border-color .2s, transform .2s;
    -webkit-tap-highlight-color: transparent;
  }
  button[aria-pressed="true"] { background: rgba(255, 136, 31, .18); border-color: rgba(255, 184, 104, .58); }
  button:hover { background: rgba(255, 136, 31, .13); border-color: rgba(255, 184, 104, .5); }
  button:active { transform: scale(.97); }
  button:focus-visible { outline: 2px solid #ffbd69; outline-offset: 3px; }
  .paused .orb-shell, .paused .aura, .paused .aura::before, .paused .energy-ring, .paused .spark, .paused .status-dot { animation-play-state: paused !important; }
  .paused .status-dot { opacity: .35; }
  .quiet-mode .aura { opacity: .35; }
  .quiet-mode .energy-ring { opacity: .35; }
  .quiet-mode .spark { opacity: .4; }
  /* Listening and speaking should feel close, responsive, and noticeably larger. */
  .scene[data-mode="listening"] .orb-stage,
  .scene[data-mode="talking"] .orb-stage {
    animation: attentive-grow 1.8s ease-in-out infinite;
  }
  .scene[data-mode="listening"] .orb-shell,
  .scene[data-mode="talking"] .orb-shell {
    animation: attentive-core 1.8s ease-in-out infinite;
  }
  .scene[data-mode="working"] .orb-shell {
    animation: working-core 3.2s linear infinite;
  }
  .scene[data-mode="working"] .energy-ring {
    animation: working-orbit 2.4s linear infinite;
    opacity: .9;
  }
  .scene[data-mode="working"] .ring-two { animation-duration: 1.65s; animation-direction: reverse; }
  .scene[data-mode="working"] .ring-three { animation-duration: 3.7s; }
  .scene[data-mode="working"] .aura { animation-duration: 3.4s; }
  .scene[data-mode="talking"] .status-dot { animation-duration: .55s; }
  @keyframes attentive-grow { 0%,100% { transform: scale(1); } 50% { transform: scale(1.13); } }
  @keyframes attentive-core { 0%,100% { transform: scale(.99); } 50% { transform: scale(1.045); } }
  @keyframes working-core { from { transform: rotate(0deg) scale(.99); } to { transform: rotate(360deg) scale(.99); } }
  @keyframes working-orbit { from { transform: rotate(0deg) scaleY(.36); } to { transform: rotate(360deg) scaleY(.36); } }
  @keyframes aura-spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%,100% { transform: scale(.982); } 50% { transform: scale(1.018); } }
  @keyframes ring-drift { 0%,100% { rotate: -7deg; scale: 1; opacity: .42; } 50% { rotate: 7deg; scale: 1.035; opacity: .88; } }
  @keyframes ring-drift-two { 0%,100% { rotate: 5deg; scale: .98; opacity: .28; } 50% { rotate: -8deg; scale: 1.04; opacity: .75; } }
  @keyframes sparkle { 0%,100% { opacity: .25; transform: scale(.65); } 50% { opacity: 1; transform: scale(1.4); } }
  @keyframes dot-pulse { 0%,100% { opacity: .52; transform: scale(.82); } 50% { opacity: 1; transform: scale(1.24); } }
  @media (max-width: 480px) { :root { --orb-size: min(76vw, 330px); } .eyebrow { margin-bottom: 24px; } .status { margin-top: 35px; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
  <main class="scene" id="scene">
    <p class="eyebrow">A LIVING INTERFACE</p>
    <h1 class="brand">Pulse Orb</h1>
    <p class="subtitle">One orb, many possibilities — think, create, listen, explore, and get things done.</p>
    <div class="orb-stage" role="img" aria-label="A living, animated orange AI orb">
      <div class="aura" aria-hidden="true"></div>
      <div class="energy-ring ring-one" aria-hidden="true"></div>
      <div class="energy-ring ring-two" aria-hidden="true"></div>
      <div class="energy-ring ring-three" aria-hidden="true"></div>
      <div class="orb-shell" id="orbShell"><canvas id="orbCanvas" aria-hidden="true"></canvas></div>
      <span class="spark" aria-hidden="true"></span>
      <span class="spark two" aria-hidden="true"></span>
      <span class="spark three" aria-hidden="true"></span>
    </div>
    <div class="status" aria-live="polite"><span class="status-dot" aria-hidden="true"></span><span id="statusText">Ready</span></div>
    <p class="hint" id="hintText">Ask, create, explore, or get things done</p>
    <div class="controls">
      <button id="modeButton" type="button">Thinking mode</button>
      <button id="ambientButton" type="button" aria-pressed="false">Ambient glow: on</button>
      <button id="pauseButton" type="button" aria-pressed="false">Pause animation</button>
    </div>
  </main>
<script>
(() => {
  const scene = document.getElementById('scene');
  const canvas = document.getElementById('orbCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const shell = document.getElementById('orbShell');
  const modeButton = document.getElementById('modeButton');
  const pauseButton = document.getElementById('pauseButton');
  const ambientButton = document.getElementById('ambientButton');
  const statusText = document.getElementById('statusText');
  const hintText = document.getElementById('hintText');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let mode = 'thinking';
  let paused = false;
  let ambient = true;
  let raf = 0;
  let start = performance.now();
  let lastSize = 0;

  const modes = {
    ready: { status: 'Ready', hint: 'Ask, create, explore, or get things done', button: 'Thinking mode', speed: .82 },
    thinking: { status: 'Thinking…', hint: 'Connecting ideas and working through the details', button: 'Working mode', speed: 1.0 },
    working: { status: 'Working…', hint: 'Turning ideas into action', button: 'Listening mode', speed: 1.48 },
    listening: { status: 'Listening…', hint: 'The orb expands while it listens for your voice', button: 'Talking mode', speed: .72 },
    talking: { status: 'Talking…', hint: 'Speaking response', button: 'Creative mode', speed: 1.12 },
    creative: { status: 'Creating…', hint: 'Exploring possibilities and making something new', button: 'Ready mode', speed: 1.22 }
  };
  const modeOrder = ['ready', 'thinking', 'working', 'listening', 'talking', 'creative'];

  function resizeCanvas() {
    const size = shell.getBoundingClientRect().width;
    if (!size || Math.abs(size - lastSize) < .5) return;
    lastSize = size;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(performance.now());
  }

  function radialGlow(x, y, radius, inner, outer) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
    g.addColorStop(0, inner);
    g.addColorStop(1, outer);
    return g;
  }

  function draw(now) {
    const size = lastSize || shell.getBoundingClientRect().width;
    if (!size) return;
    const elapsed = reduceMotion ? 0 : ((now - start) / 1000) * modes[mode].speed;
    const cx = size / 2, cy = size / 2, r = size * .49;
    ctx.clearRect(0, 0, size, size);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.clip();

    // Deep molten base, lit from a hot orange core.
    const base = ctx.createRadialGradient(-r * .28, -r * .36, r * .025, 0, 0, r * 1.23);
    base.addColorStop(0, '#fff0b0');
    base.addColorStop(.10, '#ffd078');
    base.addColorStop(.27, '#ff921e');
    base.addColorStop(.51, '#f24b04');
    base.addColorStop(.76, '#9f2500');
    base.addColorStop(1, '#260700');
    ctx.fillStyle = base;
    ctx.fillRect(-r, -r, r * 2, r * 2);

    // Moving conic light ribbons give the orb a continuously changing surface.
    if (ambient && ctx.createConicGradient) {
      const flow = ctx.createConicGradient(elapsed * .22, Math.sin(elapsed * .17) * r * .12, Math.cos(elapsed * .14) * r * .1);
      flow.addColorStop(0, 'rgba(255,225,133,.10)');
      flow.addColorStop(.12, 'rgba(255,89,4,.48)');
      flow.addColorStop(.25, 'rgba(255,182,47,.40)');
      flow.addColorStop(.40, 'rgba(220,47,0,.20)');
      flow.addColorStop(.58, 'rgba(255,123,8,.53)');
      flow.addColorStop(.74, 'rgba(255,214,91,.34)');
      flow.addColorStop(.88, 'rgba(255,69,0,.30)');
      flow.addColorStop(1, 'rgba(255,225,133,.10)');
      ctx.globalCompositeOperation = 'screen';
      ctx.fillStyle = flow;
      ctx.fillRect(-r, -r, r * 2, r * 2);
    }

    // Smooth light fields orbit and deform over time, like liquid plasma.
    const blobs = [
      { a: .56, b: .48, s: .73, w: .62, phase: .1, c: 'rgba(255,194,56,.92)' },
      { a: .48, b: .58, s: .65, w: -.47, phase: 1.8, c: 'rgba(255,80,0,.92)' },
      { a: .62, b: .42, s: .50, w: .82, phase: 3.1, c: 'rgba(255,225,132,.62)' },
      { a: .42, b: .68, s: .58, w: -.72, phase: 4.6, c: 'rgba(226,48,0,.78)' },
      { a: .38, b: .36, s: .42, w: .95, phase: 2.5, c: 'rgba(255,151,22,.82)' }
    ];
    ctx.globalCompositeOperation = ambient ? 'screen' : 'source-over';
    for (let i = 0; i < blobs.length; i++) {
      const b = blobs[i];
      const angle = elapsed * b.w + b.phase;
      const x = Math.cos(angle) * r * b.a + Math.sin(elapsed * .31 + b.phase) * r * .12;
      const y = Math.sin(angle * .83) * r * b.b + Math.cos(elapsed * .27 + b.phase) * r * .10;
      const rad = r * b.s * (.84 + .11 * Math.sin(elapsed * .9 + i));
      ctx.fillStyle = radialGlow(x, y, rad, ambient ? b.c : 'rgba(255,151,22,.42)', 'rgba(255,80,0,0)');
      ctx.fillRect(-r, -r, r * 2, r * 2);
    }

    // Fine, curved current lines move through the glow.
    ctx.globalCompositeOperation = ambient ? 'lighter' : 'source-over';
    for (let i = 0; i < (ambient ? 7 : 3); i++) {
      const phase = elapsed * (.24 + i * .018) + i * .9;
      const y = (i - 3) * r * .19 + Math.sin(phase) * r * .15;
      ctx.beginPath();
      ctx.moveTo(-r * 1.1, y + Math.cos(phase) * r * .12);
      ctx.bezierCurveTo(-r * .25, y - Math.sin(phase * 1.2) * r * .62, r * .25, y + Math.cos(phase * .8) * r * .55, r * 1.1, y + Math.sin(phase) * r * .2);
      ctx.strokeStyle = i % 2 ? 'rgba(255,222,145,.13)' : 'rgba(255,105,15,.18)';
      ctx.lineWidth = r * (i % 3 === 0 ? .018 : .009);
      ctx.stroke();
    }

    // A bright, moving hot spot and a cool dark edge make it spherical.
    const hx = Math.sin(elapsed * .45) * r * .20 - r * .28;
    const hy = Math.cos(elapsed * .38) * r * .18 - r * .30;
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = radialGlow(hx, hy, r * .57, 'rgba(255,255,231,.82)', 'rgba(255,199,93,0)');
    ctx.fillRect(-r, -r, r * 2, r * 2);

    ctx.globalCompositeOperation = 'multiply';
    const shade = ctx.createRadialGradient(-r * .24, -r * .28, r * .24, r * .08, r * .13, r * 1.19);
    shade.addColorStop(0, 'rgba(255,255,255,1)');
    shade.addColorStop(.52, 'rgba(255,220,187,.96)');
    shade.addColorStop(.84, 'rgba(83,25,3,.40)');
    shade.addColorStop(1, 'rgba(13,3,0,.88)');
    ctx.fillStyle = shade;
    ctx.fillRect(-r, -r, r * 2, r * 2);

    // Specular glass highlight.
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = radialGlow(-r * .30, -r * .34, r * .33, 'rgba(255,255,248,.78)', 'rgba(255,244,205,0)');
    ctx.fillRect(-r, -r, r * 2, r * 2);

    // Small internal sparks travel around the surface.
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < (ambient ? 9 : 4); i++) {
      const angle = elapsed * (.26 + i * .015) + i * 2.399;
      const rr = r * (.2 + .47 * ((i % 4) / 4) + .04 * Math.sin(elapsed + i));
      const x = Math.cos(angle) * rr;
      const y = Math.sin(angle * 1.13) * rr;
      const dotR = r * (i % 3 === 0 ? .012 : .007);
      ctx.fillStyle = radialGlow(x, y, dotR * 4, 'rgba(255,237,171,.95)', 'rgba(255,119,10,0)');
      ctx.beginPath(); ctx.arc(x, y, dotR * 4, 0, Math.PI * 2); ctx.fill();
    }

    ctx.restore();
    ctx.globalCompositeOperation = 'source-over';
  }

  function frame(now) {
    draw(now);
    if (!paused && !reduceMotion) raf = requestAnimationFrame(frame);
  }
  function startAnimation() {
    cancelAnimationFrame(raf);
    if (reduceMotion) { draw(performance.now()); return; }
    raf = requestAnimationFrame(frame);
  }
  function setMode(nextMode) {
    mode = nextMode;
    scene.dataset.mode = mode;
    const data = modes[mode];
    statusText.textContent = data.status;
    hintText.textContent = data.hint;
    modeButton.textContent = data.button;
    scene.style.setProperty('--rate', String(data.speed));
    startAnimation();
  }

  scene.dataset.mode = mode;

  modeButton.addEventListener('click', () => {
    const index = modeOrder.indexOf(mode);
    setMode(modeOrder[(index + 1) % modeOrder.length]);
  });

  ambientButton.addEventListener('click', () => {
    ambient = !ambient;
    ambientButton.textContent = `Ambient glow: ${ambient ? 'on' : 'off'}`;
    ambientButton.setAttribute('aria-pressed', String(!ambient));
    scene.classList.toggle('quiet-mode', !ambient);
    draw(performance.now());
  });
  pauseButton.addEventListener('click', () => {
    paused = !paused;
    scene.classList.toggle('paused', paused);
    pauseButton.textContent = paused ? 'Resume animation' : 'Pause animation';
    pauseButton.setAttribute('aria-pressed', String(paused));
    if (paused) cancelAnimationFrame(raf); else startAnimation();
  });

  if ('ResizeObserver' in window) new ResizeObserver(resizeCanvas).observe(shell);
  else window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
  if (!reduceMotion) startAnimation();
  else draw(performance.now());
})();
</script>
</body>
</html>
