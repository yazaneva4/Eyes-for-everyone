<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
<title id="title">Eyes for Everyone — a visual helper for low vision</title>
<desc id="desc">A promotional poster matching the Eyes for Everyone website: warm yellow and orange accents on a deep charcoal background, glass-like cards, and illustrated phone screens showing photo description, voice questions, spoken answers, and the live Qibla compass.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c0a09"/><stop offset="1" stop-color="#21170f"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffcf4d"/><stop offset=".55" stop-color="#ff8a1f"/><stop offset="1" stop-color="#ef6416"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#34271b"/><stop offset="1" stop-color="#17120e"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#ff8a1f" stop-opacity=".25"/><stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/></radialGradient>
  <clipPath id="screenA"><rect x="96" y="558" width="400" height="365" rx="30"/></clipPath>
  <clipPath id="screenB"><rect x="584" y="558" width="400" height="365" rx="30"/></clipPath>
  <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
</defs>
<rect width="1080" height="1350" fill="url(#bg)"/>
<circle cx="850" cy="255" r="340" fill="url(#aura)"/>
<path d="M0 480 Q300 430 540 490 T1080 460" fill="none" stroke="#ff8a1f" stroke-opacity=".12" stroke-width="2"/>
