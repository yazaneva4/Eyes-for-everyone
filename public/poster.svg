</g>
<text x="172" y="96" fill="#fff8e9" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" letter-spacing=".5">EYES FOR EVERYONE</text>
<text x="174" y="128" fill="#bdb2a4" font-family="Arial, Helvetica, sans-serif" font-size="19">A visual helper for people with low vision</text>
<!-- Hero -->
<text x="72" y="235" fill="#fff8e9" font-family="Arial, Helvetica, sans-serif" font-size="69" font-weight="800" letter-spacing="-2">See what’s around you.</text>
<text x="72" y="309" fill="#ffcf4d" font-family="Arial, Helvetica, sans-serif" font-size="69" font-weight="800" letter-spacing="-2">Hear what it means.</text>
<text x="76" y="359" fill="#d7cfc4" font-family="Arial, Helvetica, sans-serif" font-size="25">Tap. Ask out loud. Listen to the answer.</text>
